pluginManagement {
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.gameanalytics.com/release' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.gameanalytics.com/release' }
    }
}

include('godot3', 'godot4')

rootProject.name = "Godot Game Analytics"
